# nginx config for the frontend image built by the root Dockerfile (local `docker compose up`).
# The app is a single-page app with client-side routes, so any path that is not a real file
# falls back to index.html; without this, refreshing /quizzes or opening a deep link 404s.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite's hashed build output (vite.config.ts build.assetsDir) never changes under the same name,
    # so it can be cached for good. Not /assets/: public/assets/ holds unhashed images, and caching
    # those for a year would freeze a replaced one. Same rule as public/_headers.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
