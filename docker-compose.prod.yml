services:
  backend:
    build:
      context: ./OxygenBackend/QuizAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"          # localhost-only; Nginx will reach it later
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/wwwroot/uploads
      - dpkeys:/app/keys    # persist uploaded files across rebuilds
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__PostgresConnection=Host=postgres;Port=5432;Database=OxygenQuiz;Username=postgres;Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=https://api.oxygenquiz.com
      - Jwt__Audience=https://oxygenquiz.com
      - Seed__AdminPassword=${ADMIN_PASSWORD}
      - AllowedHosts=api.oxygenquiz.com
      - Cors__AllowedOrigins__0=https://oxygenquiz.com
      - Cors__AllowedOrigins__1=https://www.oxygenquiz.com
      #  AI and Google OAuth settings
      - Ai__Enabled=true
      - Ai__ApiKey=${AI_API_KEY}
      - Authentication__Google__Enabled=true
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID}
      #  Transactional email (Brevo) + the base URL its links point at
      - Email__Brevo__ApiKey=${BREVO_API_KEY}
      # Links in verification and reset emails are built from this. It previously fell back to
      # the first CORS origin, which was right by luck; once mail actually sends, a wrong link
      # is a broken feature rather than a wrong log line.
      - App__FrontendBaseUrl=https://oxygenquiz.com
      #  Paid plans (Paddle, live account). Off until BILLING_ENABLED=true is in .env.prod, and
      #  every value comes from there: Enabled=true with a blank key or secret fails startup on
      #  purpose, so the switch and what it needs arrive together. docs/auth/paid-plans.md §9.
      - Billing__Enabled=${BILLING_ENABLED:-false}
      - Billing__Provider=Paddle
      - Billing__Environment=production
      - Billing__ClientToken=${PADDLE_CLIENT_TOKEN:-}
      - Billing__ApiKey=${PADDLE_API_KEY:-}
      - Billing__WebhookSecret=${PADDLE_WEBHOOK_SECRET:-}
      - Billing__Prices__PlusMonthly=${PADDLE_PRICE_PLUS_MONTHLY:-}
      - Billing__Prices__PlusYearly=${PADDLE_PRICE_PLUS_YEARLY:-}
      - Billing__Prices__TeacherMonthly=${PADDLE_PRICE_TEACHER_MONTHLY:-}
      - Billing__Prices__TeacherYearly=${PADDLE_PRICE_TEACHER_YEARLY:-}
      # - Security__EnforceProductionConfig=true   # turn ON after domain+TLS are wired and tested
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: OxygenQuiz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  uploads:
  dpkeys:
