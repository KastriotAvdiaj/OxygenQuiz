# Live production reverse proxy: /etc/nginx/sites-available/api.oxygenquiz.com on the VPS,
# symlinked into sites-enabled/. Committed because it is half the definition of production —
# it terminates TLS and is the only route from the internet to the backend, which listens on
# 127.0.0.1:5000 and is otherwise unreachable. See docs/deployment/production-topology.md.
#
# This is a COPY for version control. Editing it here changes nothing on the server; copy it
# across and `sudo nginx -t && sudo systemctl reload nginx`. The Debian default site is also
# enabled there and is stock boilerplate, so it is not tracked.
#
# The certificate is a Cloudflare Origin certificate at /etc/ssl/cloudflare/ (not in git, and
# it must not be — origin.key is a private key). Browsers don't trust it, but that does NOT make
# the host unreachable except through Cloudflare: a client that skips verification
# (`curl -k https://<vps-ip>`) connects fine. Only the firewall restricting 443 to Cloudflare's
# ranges does that — see docs/deployment/production-topology.md, "Locking the edge".
server {
    listen 443 ssl;
    server_name api.oxygenquiz.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Visitor IP from CF-Connecting-IP, trusted from Cloudflare's ranges only (see that file).
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for SignalR (/quizHub, /notificationHub)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        # $remote_addr is the visitor here (real_ip above). X-Forwarded-For is OVERWRITTEN with it,
        # not appended to: an appended chain carries whatever the client sent first, and the app's
        # UseForwardedHeaders reads one value. CF-Connecting-IP is cleared so nothing downstream can
        # be tempted to trust a header a direct caller could have written.
        # docs/adr/0027-the-client-ip-is-resolved-at-nginx.md
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts so a SignalR connection is not cut mid-quiz.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    server_name api.oxygenquiz.com;
    return 301 https://$host$request_uri;
}
